; ======================================
; Supervisor - Manual Contable AI
; ======================================
; Copiar a: /etc/supervisor/conf.d/manual_contable.conf
;
; Comandos:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start manual_contable
;   sudo supervisorctl status manual_contable
;   sudo supervisorctl tail -f manual_contable

[program:manual_contable]
command=/home/gaibarra/manual_contable_ai/venv/bin/gunicorn
    manual_contable_ai.wsgi:application
    --config /home/gaibarra/manual_contable_ai/deploy/gunicorn.conf.py
directory=/home/gaibarra/manual_contable_ai
user=www-data
group=www-data

; Reinicio automático
autostart=true
autorestart=true
startsecs=10
startretries=3

; Señales de parada
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Logging
stdout_logfile=/var/log/supervisor/manual_contable_out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/manual_contable_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
redirect_stderr=false

; Variables de entorno (clave=valor separados por comas)
; NOTA: Es preferible usar EnvironmentFile en systemd, pero supervisor
; requiere definirlas aquí o en el .env que Django lee con python-decouple
environment=
    LANG="es_MX.UTF-8",
    LC_ALL="es_MX.UTF-8",
    DJANGO_SETTINGS_MODULE="manual_contable_ai.settings"

; Prioridad de arranque (menor = arranca primero)
priority=100

; Límites
numprocs=1
