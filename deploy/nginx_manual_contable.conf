# ======================================
# Nginx - Manual Contable AI
# ======================================
# Copiar a: /etc/nginx/sites-available/manual_contable
# Activar:  sudo ln -s /etc/nginx/sites-available/manual_contable /etc/nginx/sites-enabled/
# Probar:   sudo nginx -t
# Recargar: sudo systemctl reload nginx
#
# IMPORTANTE: Antes de activar HTTPS con Certbot:
#   1. Asegúrate de que el dominio apunte a la IP del servidor (DNS A record)
#   2. Usa primero el bloque HTTP (puerto 80) sin HTTPS
#   3. Ejecuta: sudo certbot --nginx -d manualcontable.online -d www.manualcontable.online
#   4. Certbot modificará este archivo automáticamente para agregar SSL

# ─── Redirigir HTTP a HTTPS ───
server {
    listen 80;
    listen [::]:80;
    server_name manualcontable.online www.manualcontable.online;

    # Certbot challenge (dejar para renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Servidor HTTPS principal ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manualcontable.online www.manualcontable.online;

    # ── Certificados SSL (Certbot los genera aquí) ──
    # Estas líneas las agrega Certbot automáticamente, pero las dejo como referencia:
    ssl_certificate /etc/letsencrypt/live/manualcontable.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manualcontable.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers de seguridad ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logs ──
    access_log /var/log/nginx/manual_contable_access.log;
    error_log /var/log/nginx/manual_contable_error.log;

    # ── Límites ──
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── Archivos estáticos (servidos directamente por Nginx) ──
    location /static/ {
        alias /home/gaibarra/manual_contable_ai/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Archivos media (si los hubiera) ──
    location /media/ {
        alias /home/gaibarra/manual_contable_ai/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Favicon ──
    location /favicon.ico {
        alias /home/gaibarra/manual_contable_ai/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 90d;
    }

    # ── Django/Gunicorn (proxy reverso) ──
    location / {
        proxy_pass http://unix:/home/gaibarra/manual_contable_ai/manual_contable.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts altos por las llamadas a OpenAI
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ── Bloquear acceso a archivos sensibles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.env$ {
        deny all;
    }
}
