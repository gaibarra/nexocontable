{% extends "base_app.html" %}
{% block title %}Editar manual — Manual Contable AI{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <a href="{% url 'detalle_manual' manual.pk %}" class="text-brand-600 text-sm hover:underline">← Volver</a>
    <h1 class="text-2xl font-bold mt-2 mb-6">✏️ Editar manual</h1>

    <form method="post" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sm:p-8 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
            <input type="text" name="titulo" value="{{ manual.titulo }}"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contenido (Markdown)</label>
            <textarea name="contenido" rows="25"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 font-mono text-sm">{{ manual.contenido }}</textarea>
        </div>
        <button type="submit" class="gradient-bg text-white px-8 py-3 rounded-lg font-bold hover:opacity-90">
            Guardar cambios
        </button>
    </form>
</div>
{% endblock %}
