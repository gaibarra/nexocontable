{% if items.has_other_pages %}<nav class="pagination" aria-label="Paginación">{% if items.has_previous %}<a class="button secondary" href="{% querystring page=items.previous_page_number %}">← Anterior</a>{% endif %}<span>Página {{ items.number }} de {{ items.paginator.num_pages }} · {{ items.paginator.count }} registros</span>{% if items.has_next %}<a class="button secondary" href="{% querystring page=items.next_page_number %}">Siguiente →</a>{% endif %}</nav>{% endif %}
