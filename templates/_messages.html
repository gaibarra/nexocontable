{% if notifications %}
{{ notifications|json_script:"app-notifications" }}
<div id="notification-fallback" class="px-6 pt-4 max-w-7xl mx-auto" role="status">
    {% for notification in notifications %}
    <div class="p-4 rounded-lg mb-3 bg-white border border-gray-300 whitespace-pre-line">{{ notification.text }}</div>
    {% endfor %}
</div>
{% endif %}
