{% load static notifications %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Manual Contable AI{% endblock %}</title>
    <meta name="description"
        content="{% block meta_description %}Manuales contables personalizados por organización, con referencias a NIF mexicanas y NIIF/IFRS aplicables. Prepara y revisa documentos para tus clientes con apoyo de IA.{% endblock %}">
    <meta name="theme-color" content="#1a365d">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/nexocontable-app-icon.svg' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#f7fafc', 100: '#ebf4ff', 200: '#c3ddfd',
                            300: '#90cdf4', 400: '#63b3ed', 500: '#2b6cb0',
                            600: '#1a365d', 700: '#153e75', 800: '#0f2f52', 900: '#0b2340'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 55%, #38a169 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .sidebar-link {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
            border-radius: 0.75rem;
        }

        /* Prose styles for Markdown content */
        .prose h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 1rem;
            color: #111827;
        }

        .prose h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .prose h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #374151;
        }

        .prose p {
            margin-bottom: 1rem;
            line-height: 1.625;
            color: #4b5563;
        }

        .prose ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: #4b5563;
        }

        .prose ol {
            list-style-type: decimal;
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: #4b5563;
        }

        .prose blockquote {
            border-left: 4px solid #4361ee;
            padding-left: 1rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
            font-style: italic;
            background-color: #f5f7ff;
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .prose th {
            background-color: #f9fafb;
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
        }

        .prose td {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            border-bottom: 1px solid #f3f4f6;
        }

        .prose strong {
            font-weight: 700;
            color: #111827;
        }

        /* Print Styles */
        @media print {
            @page {
                size: auto;
                margin: 12mm 12mm 18mm 12mm;
            }

            .no-print {
                display: none !important;
            }

            .print-header,
            .print-footer {
                display: block !important;
            }

            .print-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: white;
                z-index: 50;
                padding-top: 0;
            }

            .print-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                z-index: 50;
            }

            .print-header-spacer {
                display: block !important;
                height: 24mm;
            }

            .print-footer-spacer {
                display: block !important;
                height: 10mm;
            }

            .print-header p,
            .print-header h2 {
                margin-bottom: 0;
            }

            .print-header h2 {
                font-size: 1rem;
                line-height: 1.2;
            }

            .print-header .text-lg {
                font-size: 0.9rem;
                line-height: 1.2;
            }

            .print-header .text-sm {
                font-size: 0.72rem;
                line-height: 1.25;
            }

            .print-header .text-xs {
                font-size: 0.62rem;
                line-height: 1.1;
            }

            body {
                background: white !important;
                color: black !important;
                margin: 0 !important;
            }

            aside,
            nav,
            .sidebar {
                display: none !important;
            }

            main {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .print-header, .print-footer {
                page-break-inside: avoid;
            }

            .prose {
                max-width: none !important;
                font-size: 0.92rem;
                line-height: 1.5;
            }

            .prose > :first-child {
                margin-top: 0 !important;
            }

            .prose h1 {
                border-bottom: 2px solid #000;
                margin-top: 0;
            }

            .prose h2 {
                page-break-before: auto;
                border-bottom: 1px solid #eee;
                padding-bottom: 0.5rem;
                margin-top: 1rem;
            }

            .prose table {
                page-break-inside: avoid;
            }

            .prose blockquote {
                background: none !important;
                border-color: #ccc !important;
            }
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/mobile-app.css' %}?v=compact-report-6">
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">
    {% app_notifications %}
    {% block body %}{% endblock %}
    <script src="{% static 'js/notifications.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
