<a href="{% url route_name %}" class="mobile-tab" {% if request.resolver_match.url_name == route_name %}aria-current="page"{% endif %}>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        {% if symbol == 'home' %}<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>
        {% elif symbol == 'catalog' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
        {% elif symbol == 'manual' %}<path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1zm0 0v15"/>
        {% elif symbol == 'profile' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
        {% else %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1M9 15h1m4 0h1M10 21v-3h4v3"/>{% endif %}
    </svg>
    <span>{{ label }}</span>
</a>
